<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aplikasi Halaqoh Tahfidz Online</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div id="login" class="login-page">
  <div class="login-card">

  </div>
</div>
<div id="app" class="hidden">
<aside id="sidebar"><div class="brand"><span>☪</span><div><b>Halaqoh</b><small>Tahfidz Online</small></div></div><nav id="nav"></nav><div class="sidebottom"><small id="who"></small><button id="logout" class="logout">Keluar</button></div></aside>
<main><header class="mobile-head"><button id="menu">☰</button><b>Halaqoh Tahfidz Online</b></header><div id="view"></div></main>
</div>
<div id="modal"></div><div id="toast"></div>
<script src="app.js"></script>
</body></html>
