<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aplikasi Halaqoh Tahfidz Online</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div id="toast"></div>
<section id="login" class="login">
 <div class="login-card">
  <div class="ornament">﷽</div>
  <div class="brand"><span>☪</span><div><b>Aplikasi Halaqoh</b><small>Tahfidz Online</small></div></div>
  <div class="crescent">۞</div>
  <h1>Assalamu'alaikum</h1>
  <p>Silakan masuk untuk mengelola perkembangan hafalan santri.</p>
  <form id="loginForm">
   <label>Username<input id="username" autocomplete="username" required></label>
   <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
   <p id="loginError" class="error hidden"></p>
   <button class="primary full">Masuk ke Halaqoh</button>
  </form>
  <small class="login-note">Aplikasi Halaqoh Tahfidz Online</small>
 </div>
</section>
<div id="app" class="hidden">
 <aside id="sidebar">
  <div class="brand"><span>☪</span><div><b>Aplikasi Halaqoh</b><small>Tahfidz Online</small></div></div>
  <div class="ayah">وَقُلْ رَبِّ زِدْنِي عِلْمًا</div>
  <nav id="nav"></nav>
  <div class="bottom"><small id="who"></small><button id="logout">Keluar</button></div>
 </aside>
 <main><header><button id="menu">☰</button><b>Aplikasi Halaqoh Tahfidz Online</b></header><div id="view"></div></main>
</div>
<div id="modal"></div>
<script src="app.js"></script>
</body></html>
